<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ACCA Duo</title>

    <!-- Geist + Geist Mono via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme bootstrap. This runs synchronously before Vue/Pinia load so
      data-theme is already set on <html> when the first paint happens.
      Without this, dark-mode users would see a brief flash of light on reload.

      We only support 'light' and 'dark' now. The 'system' check is preserved as
      a fallback path for users who have the legacy value in localStorage
      from before we removed it.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('acca_duo.theme');
          var effective;
          if (raw === 'light' || raw === 'dark') {
            effective = raw;
          } else {
            // No saved value (or legacy 'system') — resolve from OS once.
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            effective = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', effective);
        } catch (e) {
          // localStorage can fail in private mode / sandboxed iframes; fall back to dark.
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
