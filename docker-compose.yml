# Production-style compose: builds the multi-stage Dockerfiles and runs the
# resulting images. External Postgres only - no postgres service here.
#
# Usage:
#   # 1) provide secrets via .env at the repo root (NOT committed)
#   #    minimal vars: see backend/.env.example
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
#   # subsequent runs (no rebuild needed unless code changed):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
#   # logs:
#   docker compose -f docker-compose.prod.yml logs -f backend
#
#   # migrations: run automatically at backend container start via node-pg-migrate.
#   # Idempotent - already-applied migrations are skipped via the pgmigrations table.
#
# IMPORTANT:
#   - DATABASE_URL must point to your external Postgres reachable from inside
#     the container. If your DB is on the docker host itself, use
#     `host.docker.internal` on Mac/Windows or your host's LAN IP on Linux.
#   - Frontend image bakes VITE_API_BASE_URL at BUILD time. Rebuild if you
#     change where the API is served from.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    image: finshark-backend:latest
    container_name: finshark-backend
    env_file:
      - ./.env
    # Infra-level path that must match the volume mount below. Set here (not
    # only in .env) so it's correct regardless of what the operator's .env says
    # - the named volume is mounted at /uploads and the app writes there.
    environment:
      UPLOADS_DIR: /uploads
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    # Persist admin-edited locale overrides across image rebuilds. Without this
    # volume, every `docker compose up --build` would overwrite admin edits with
    # whatever en.json/ru.json shipped in the image. The named volume keeps the
    # edited files on the host. On first run the entrypoint will see the volume
    # already populated (empty objects after seed) - the app falls back to {}
    # if a file is missing, so an empty volume is a safe initial state.
    #
    # Persist user-uploaded payment slips across rebuilds the same way. The
    # backend writes slips under UPLOADS_DIR, which we set to /uploads (a
    # root-level path outside the app tree) and back with a named volume. The
    # Dockerfile pre-creates /uploads owned by the non-root `nodeapp` user so
    # the container can mkdir subdirs (payment-slips/) without EACCES - a named
    # volume inherits the mountpoint's ownership on first creation. Losing this
    # volume would orphan the slip_path rows in payment_submissions (the DB rows
    # survive; the files behind them wouldn't), so it must persist.
    volumes:
      - locales:/app/backend/locales
      - uploads:/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        # Vite bakes this URL into the bundle at build time.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: finshark-frontend:latest
    container_name: finshark-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  locales:
  uploads: