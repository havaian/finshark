# Production-style compose: builds the multi-stage Dockerfiles and runs the
# resulting images. External Postgres only — no postgres service here.
#
# Usage:
#   # 1) provide secrets via .env at the repo root (NOT committed)
#   #    minimal vars: see backend/.env.example
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
#   # subsequent runs (no rebuild needed unless code changed):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
#   # logs:
#   docker compose -f docker-compose.prod.yml logs -f backend
#
#   # migrations: run automatically at backend container start via node-pg-migrate.
#   # Idempotent — already-applied migrations are skipped via the pgmigrations table.
#
# IMPORTANT:
#   - DATABASE_URL must point to your external Postgres reachable from inside
#     the container. If your DB is on the docker host itself, use
#     `host.docker.internal` on Mac/Windows or your host's LAN IP on Linux.
#   - Frontend image bakes VITE_API_BASE_URL at BUILD time. Rebuild if you
#     change where the API is served from.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    image: acca-duo-backend:latest
    container_name: acca-duo-backend
    env_file:
      - ./.env
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        # Vite bakes this URL into the bundle at build time.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: acca-duo-frontend:latest
    container_name: acca-duo-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped